# Lancement complet (MySQL + application) : docker compose up --build
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rplace_clicker_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/rplace_clicker_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
